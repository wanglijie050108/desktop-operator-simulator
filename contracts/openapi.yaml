openapi: 3.1.0
info:
  title: Human Operation Simulator Control API
  version: 0.1.0
  description: 管理端和本地组件使用的 API 契约。
servers:
  - url: http://127.0.0.1:7070
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Service is ready.
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status:
                    const: ok
                  version:
                    type: string
  /api/v1/agents:
    get:
      operationId: listAgents
      responses:
        "200":
          description: Known desktop agents.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
  /api/v1/tasks:
    get:
      operationId: listTasks
      parameters:
        - name: state
          in: query
          schema:
            $ref: "#/components/schemas/TaskState"
      responses:
        "200":
          description: Task summary list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
  /api/v1/tasks/{taskId}:
    get:
      operationId: getTask
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/tasks/{taskId}/cancel:
    post:
      operationId: cancelTask
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "202":
          description: Cancellation accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "409":
          description: Task is already terminal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/system/emergency-stop:
    post:
      operationId: emergencyStop
      responses:
        "202":
          description: Stop signal accepted and new work paused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedAgentBroadcast"
components:
  parameters:
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    Agent:
      type: object
      required: [id, name, status, capabilities, lastSeenAt, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [ONLINE, OFFLINE, PAUSED, BUSY]
        capabilities:
          type: array
          items:
            type: string
        lastSeenAt:
          type: string
          format: date-time
        version:
          type: string
    TaskState:
      type: string
      enum:
        - RECEIVED
        - PLANNED
        - WAITING_FOR_INPUT
        - RUNNING
        - WAITING_FOR_HUMAN
        - SUCCEEDED
        - FAILED
        - CANCELLED
        - REJECTED
        - INTERRUPTED
    Task:
      type: object
      required:
        - id
        - shortCode
        - type
        - state
        - request
        - policyVersion
        - createdAt
        - updatedAt
        - steps
      properties:
        id:
          type: string
          format: uuid
        shortCode:
          type: string
        type:
          type: string
          enum: [AI_QUESTION, PRODUCT_SEARCH]
        state:
          $ref: "#/components/schemas/TaskState"
        request:
          $ref: "#/components/schemas/TaskRequest"
        result:
          oneOf:
            - $ref: "#/components/schemas/AiQuestionResult"
            - $ref: "#/components/schemas/ProductSearchResult"
            - $ref: "#/components/schemas/TaskErrorResult"
            - type: "null"
        policyVersion:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        steps:
          type: array
          items:
            $ref: "#/components/schemas/TaskStep"
    TaskStep:
      type: object
      additionalProperties: false
      required:
        - id
        - taskId
        - sequence
        - name
        - state
        - attempt
        - errorCode
        - artifactRefs
        - startedAt
        - finishedAt
      properties:
        id:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        sequence:
          type: integer
          minimum: 1
        name:
          type: string
        state:
          type: string
          enum: [PENDING, RUNNING, SUCCEEDED, FAILED, SKIPPED]
        attempt:
          type: integer
          minimum: 0
        errorCode:
          type: [string, "null"]
        artifactRefs:
          type: array
          items: {}
        startedAt:
          type: [string, "null"]
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
    AiQuestionResult:
      type: object
      additionalProperties: false
      required: [answer, durationMs, source]
      properties:
        answer:
          type: string
        durationMs:
          type: integer
          minimum: 0
        source:
          type: string
    TaskRequest:
      oneOf:
        - $ref: "#/components/schemas/AiQuestionRequest"
        - $ref: "#/components/schemas/ProductSearchRequest"
        - $ref: "#/components/schemas/IncompleteProductSearchRequest"
    AiQuestionRequest:
      type: object
      additionalProperties: false
      required: [conversationId, question, source]
      properties:
        conversationId:
          type: string
        question:
          type: string
        source:
          const: WECHAT
    ProductSearchRequest:
      type: object
      additionalProperties: false
      required: [conversationId, query, maxPrice, candidateCount, preferences, source]
      properties:
        conversationId:
          type: string
        query:
          type: string
        maxPrice:
          type: number
          exclusiveMinimum: 0
        candidateCount:
          type: integer
          minimum: 1
          maximum: 3
        preferences:
          type: array
          maxItems: 5
          items:
            type: string
        source:
          const: WECHAT
    IncompleteProductSearchRequest:
      type: object
      additionalProperties: false
      required: [conversationId, missingFields, source]
      properties:
        conversationId:
          type: string
        missingFields:
          type: array
          items:
            type: string
            enum: [query, maxPrice, candidateCount]
        source:
          const: WECHAT
    ProductCandidate:
      type: object
      additionalProperties: false
      required:
        - title
        - price
        - shopName
        - rating
        - salesText
        - url
        - attributes
        - collectedAt
        - rank
        - score
      properties:
        title:
          type: string
        price:
          type: number
          exclusiveMinimum: 0
        shopName:
          type: [string, "null"]
        rating:
          type: [number, "null"]
          minimum: 0
          maximum: 5
        salesText:
          type: [string, "null"]
        url:
          type: string
          format: uri
          pattern: ^https://
        attributes:
          type: object
          additionalProperties:
            type: string
        collectedAt:
          type: string
          format: date-time
        rank:
          type: integer
          minimum: 1
          maximum: 3
        score:
          type: number
          minimum: 0
          maximum: 1
    ProductSearchResult:
      type: object
      additionalProperties: false
      required: [query, maxPrice, products, source, adapterVersion, collectedAt]
      properties:
        query:
          type: string
        maxPrice:
          type: number
          exclusiveMinimum: 0
        products:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: "#/components/schemas/ProductCandidate"
        source:
          type: string
        adapterVersion:
          type: string
        collectedAt:
          type: string
          format: date-time
    TaskErrorResult:
      type: object
      additionalProperties: false
      required: [errorCode]
      properties:
        errorCode:
          type: string
        missingFields:
          type: array
          items:
            type: string
            enum: [query, maxPrice, candidateCount]
    Error:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
          format: uuid
    AcceptedAgentBroadcast:
      type: object
      required: [accepted, notifiedAgents]
      additionalProperties: false
      properties:
        accepted:
          const: true
        notifiedAgents:
          type: integer
          minimum: 0
  responses:
    ValidationError:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
