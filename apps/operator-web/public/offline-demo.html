<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>离线降级演示 · 测试夹具</title>
    <style>
      :root {
        color: #202523;
        font-family: Inter, "SF Pro Text", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #eef1ef;
      }

      button {
        color: inherit;
        font: inherit;
      }

      button:focus-visible {
        outline: 2px solid #167d68;
        outline-offset: 2px;
      }

      .fixture-banner {
        padding: 10px 20px;
        background: repeating-linear-gradient(
          45deg,
          #8a2c21,
          #8a2c21 12px,
          #a53a2d 12px,
          #a53a2d 24px
        );
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-size: 13px;
        font-weight: 700;
        text-align: center;
      }

      .fixture-banner small {
        font-weight: 400;
      }

      .stage {
        max-width: 1180px;
        margin: 0 auto;
        padding: 26px 24px 34px;
      }

      .scene-heading {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }

      .scene-heading h1 {
        margin: 0;
        font-size: 21px;
      }

      .scene-heading p {
        margin: 6px 0 0;
        color: #6d7772;
        font-size: 13px;
      }

      .scene-kicker {
        color: #176b5c;
        font-family: "SFMono-Regular", Consolas, monospace;
        font-size: 11px;
        font-weight: 700;
      }

      .scene-layout {
        margin-top: 20px;
        display: grid;
        grid-template-columns: 340px 1fr;
        gap: 20px;
        align-items: start;
      }

      .phone {
        position: relative;
        padding: 14px;
        border: 8px solid #2b312e;
        border-radius: 30px;
        background: #1f2623;
      }

      .phone::after {
        position: absolute;
        top: 4px;
        left: 50%;
        width: 90px;
        height: 6px;
        border-radius: 0 0 8px 8px;
        background: #0e1210;
        content: "";
        transform: translateX(-50%);
      }

      .phone-title {
        margin: 8px 2px 10px;
        color: #cfd8d3;
        font-size: 12px;
        text-align: center;
      }

      .chat {
        min-height: 430px;
        max-height: 430px;
        padding: 12px;
        border-radius: 14px;
        background: #e8ede9;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 9px;
      }

      .bubble {
        max-width: 86%;
        padding: 9px 12px;
        border-radius: 12px;
        font-size: 12px;
        line-height: 1.6;
        white-space: pre-wrap;
      }

      .bubble.in {
        align-self: flex-start;
        background: #ffffff;
      }

      .bubble.out {
        align-self: flex-end;
        background: #dcf0e8;
      }

      .bubble.system {
        align-self: center;
        background: #f6e2e0;
        color: #8a2c21;
        font-size: 11px;
        text-align: center;
      }

      .bubble.meta {
        align-self: center;
        color: #7a8580;
        font-size: 11px;
        text-align: center;
      }

      .console-card {
        padding: 20px;
        border: 1px solid #d7dedb;
        border-radius: 14px;
        background: #ffffff;
      }

      .console-top {
        padding-bottom: 14px;
        border-bottom: 1px solid #e3e9e6;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 12px;
        color: #5c6661;
      }

      .status-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #21866d;
        box-shadow: 0 0 0 3px #d9eee8;
      }

      .status-dot.off {
        background: #98a19c;
        box-shadow: 0 0 0 3px #e3e9e6;
      }

      .intercept-banner {
        margin-top: 14px;
        padding: 11px 14px;
        border: 1px solid #d98f85;
        border-radius: 9px;
        background: #fff1ef;
        color: #8a2c21;
        font-size: 12px;
        line-height: 1.6;
      }

      .intercept-banner strong {
        display: block;
        margin-bottom: 2px;
      }

      .task-empty {
        margin-top: 16px;
        padding: 30px;
        border: 1px dashed #c3ccc7;
        border-radius: 10px;
        color: #8a948f;
        text-align: center;
        font-size: 13px;
      }

      .task-block {
        margin-top: 16px;
      }

      .task-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .task-head strong {
        font-size: 14px;
      }

      .task-code {
        color: #176b5c;
        font-family: "SFMono-Regular", Consolas, monospace;
        font-size: 11px;
      }

      .state-pill {
        padding: 3px 10px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 700;
      }

      .state-pill.SUCCEEDED {
        background: #e3f4ed;
        color: #176b5c;
      }

      .state-pill.FAILED,
      .state-pill.REJECTED,
      .state-pill.CANCELLED {
        background: #fbe6e3;
        color: #8a2c21;
      }

      .state-pill.RUNNING {
        background: #e5f0fa;
        color: #286490;
      }

      .steps {
        margin: 14px 0 0;
        padding: 0;
        list-style: none;
      }

      .steps li {
        position: relative;
        padding: 0 0 14px 30px;
        color: #5c6661;
        font-size: 12px;
      }

      .steps li:not(:last-child)::before {
        position: absolute;
        top: 14px;
        bottom: 0;
        left: 8px;
        width: 1px;
        background: #d7dedb;
        content: "";
      }

      .step-mark {
        position: absolute;
        top: 0;
        left: 0;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        font-size: 10px;
        display: grid;
        place-items: center;
      }

      .step-mark.done {
        background: #dcf0e8;
        color: #176b5c;
      }

      .step-mark.active {
        background: #e5f0fa;
        color: #286490;
      }

      .step-mark.pending,
      .step-mark.skip {
        background: #eef1ef;
        color: #8a948f;
      }

      .result-box {
        margin-top: 14px;
        padding: 13px 15px;
        border-radius: 9px;
        background: #f6f9f7;
        font-size: 12px;
        line-height: 1.8;
      }

      .result-box .row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        border-bottom: 1px solid #e3e9e6;
      }

      .result-box .row:last-child {
        border-bottom: 0;
      }

      .result-box code {
        color: #8a2c21;
        font-family: "SFMono-Regular", Consolas, monospace;
        font-size: 11px;
      }

      .metrics-grid {
        margin-top: 16px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }

      .metric-tile {
        padding: 16px;
        border-radius: 10px;
        background: #f6f9f7;
        text-align: center;
      }

      .metric-tile strong {
        display: block;
        font-size: 22px;
      }

      .metric-tile span {
        color: #7a8580;
        font-size: 11px;
      }

      .fixture-again {
        margin-top: 14px;
        padding: 10px 14px;
        border-radius: 8px;
        background: #eef4fb;
        color: #335271;
        font-size: 11px;
      }

      .controls {
        margin-top: 24px;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .nav-button {
        min-height: 36px;
        padding: 0 16px;
        border: 1px solid #c6ceca;
        border-radius: 8px;
        background: #ffffff;
        cursor: pointer;
        font-size: 13px;
      }

      .nav-button.play {
        border-color: #176b5c;
        background: #176b5c;
        color: #ffffff;
      }

      .nav-button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .dots {
        display: flex;
        gap: 8px;
        flex: 1;
        flex-wrap: wrap;
      }

      .dot {
        padding: 6px 12px;
        border: 1px solid #c6ceca;
        border-radius: 20px;
        background: #ffffff;
        color: #5c6661;
        font-size: 11px;
        cursor: pointer;
      }

      .dot.active {
        border-color: #176b5c;
        background: #e3f4ed;
        color: #176b5c;
        font-weight: 700;
      }

      .watermark {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
        z-index: 5;
        overflow: hidden;
      }

      .watermark span {
        color: rgba(138, 44, 33, 0.06);
        font-size: 90px;
        font-weight: 800;
        transform: rotate(-24deg);
        white-space: nowrap;
        user-select: none;
      }

      @media (max-width: 820px) {
        .scene-layout {
          grid-template-columns: 1fr;
        }

        .chat {
          min-height: 300px;
          max-height: 300px;
        }

        .metrics-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="fixture-banner" data-testid="fixture-banner">
      <span>测试夹具 · 离线降级演示</span>
      <small>以下全部为模拟数据，不代表真实网站或真实模型结果</small>
    </div>

    <div class="watermark" aria-hidden="true"><span>测试夹具</span></div>

    <main class="stage">
      <div class="scene-heading">
        <div>
          <span class="scene-kicker" data-testid="scene-kicker"></span>
          <h1 data-testid="scene-title"></h1>
          <p data-testid="scene-narration"></p>
        </div>
      </div>

      <div class="scene-layout">
        <section class="phone" aria-label="微信手机模拟">
          <div class="phone-title">微信 · fixture-conversation</div>
          <div class="chat" data-testid="chat"></div>
        </section>

        <section class="console-card" aria-label="任务控制台模拟">
          <div class="console-top">
            <span class="status-dot" id="agent-dot" data-testid="agent-dot"></span>
            <span id="agent-line" data-testid="agent-line"></span>
          </div>
          <div id="intercept" data-testid="intercept"></div>
          <div id="task" data-testid="task"></div>
        </section>
      </div>

      <div class="controls">
        <div class="dots" id="dots" data-testid="dots"></div>
        <button class="nav-button" id="prev" data-testid="prev">上一步</button>
        <button class="nav-button play" id="play" data-testid="play">自动播放</button>
        <button class="nav-button" id="next" data-testid="next">下一步</button>
      </div>
    </main>

    <script>
      "use strict";

      const scenes = [
        {
          kicker: "SCENE 01 / 06",
          title: "系统就绪",
          narration: "管理台显示 Windows 执行节点在线，当前任务队列为空。",
          agentOnline: true,
          agentText: "Windows-Desk-01 · 在线 · v0.1.0（夹具节点）",
          chat: [{ type: "meta", text: "会话已建立，等待指令" }],
          emptyTask: "队列空 · 暂无任务",
        },
        {
          kicker: "SCENE 02 / 06",
          title: "AI 问答闭环",
          narration: "手机发送 AI 问题，任务依次完成策略校验、模型询问与微信回复。",
          agentOnline: true,
          agentText: "Windows-Desk-01 · 在线 · v0.1.0（夹具节点）",
          chat: [
            { type: "in", text: "#助手 问AI：解释什么是零信任网络" },
            {
              type: "out",
              text: "零信任网络默认不信任任何内外网请求，每次访问都需验证与授权。（夹具答案）",
            },
          ],
          task: {
            code: "A1B2C3D4 · AI_QUESTION",
            title: "解释什么是零信任网络",
            state: "SUCCEEDED",
            steps: [
              { name: "ValidatePolicy 策略校验", mark: "done", label: "✓" },
              { name: "AskAi 模型询问（fixture-ai）", mark: "done", label: "✓" },
              { name: "SendChatReply 微信回复", mark: "done", label: "✓" },
            ],
            result: [
              ["来源", "fixture-ai（测试夹具）"],
              ["耗时", "13,200 ms（夹具计时）"],
            ],
          },
        },
        {
          kicker: "SCENE 03 / 06",
          title: "商品查询闭环",
          narration: "带预算的商品比较请求返回三款夹具商品，预算约束始终生效。",
          agentOnline: true,
          agentText: "Windows-Desk-01 · 在线 · v0.1.0（夹具节点）",
          chat: [
            { type: "in", text: "#助手 找商品：无线鼠标 预算300元" },
            { type: "out", text: "为你比较三款夹具商品，均不超过 300 元预算。（测试夹具数据）" },
          ],
          task: {
            code: "M3A1B2C3 · PRODUCT_SEARCH",
            title: "无线鼠标 · 预算 ¥300",
            state: "SUCCEEDED",
            steps: [
              { name: "OpenShoppingSite 打开 shop.fixture.test", mark: "done", label: "✓" },
              { name: "ExtractCandidates 抽取候选", mark: "done", label: "✓" },
              { name: "RankCandidates 预算内排序", mark: "done", label: "✓" },
            ],
            result: [
              ["夹具商品 A · Fixture Store", "¥199.00"],
              ["夹具商品 B · Fixture Store", "¥159.00"],
              ["夹具商品 C · Fixture Store", "¥229.00"],
            ],
          },
        },
        {
          kicker: "SCENE 04 / 06",
          title: "危险动作策略拒绝",
          narration: "支付/下单类请求在规划前被策略拦截，任务标记为 REJECTED。",
          agentOnline: true,
          agentText: "Windows-Desk-01 · 在线 · v0.1.0（夹具节点）",
          chat: [
            { type: "in", text: "#助手 帮我下单第一款" },
            { type: "system", text: "策略拒绝：禁止支付与下单动作" },
          ],
          intercept: {
            title: "策略拦截 PROHIBITED_ACTION",
            body: "下单/支付属于禁止动作，请求在任务规划前被拒绝，未向任何页面发送指令。（测试夹具演示）",
          },
          task: {
            code: "R2D3T4X5 · PRODUCT_SEARCH",
            title: "请求被拒绝",
            state: "REJECTED",
            steps: [
              { name: "ValidatePolicy 策略校验", mark: "skip", label: "⊘" },
              { name: "OpenShoppingSite", mark: "skip", label: "⊘" },
              { name: "PlaceOrder（禁止动作）", mark: "skip", label: "⊘" },
            ],
            result: [["errorCode", "PROHIBITED_ACTION"]],
          },
        },
        {
          kicker: "SCENE 05 / 06",
          title: "紧急停止",
          narration: "任务执行中触发紧急停止，2 秒内任务取消、物理输入释放。",
          agentOnline: false,
          agentText: "Windows-Desk-01 · 已暂停/输入释放 · v0.1.0（夹具节点）",
          chat: [{ type: "in", text: "#助手 问AI：最新的行业报告" }],
          intercept: {
            title: "紧急停止 EMERGENCY_STOP",
            body: "已向节点广播急停：任务取消，所有按键/鼠标输入释放，新工作暂停。（测试夹具演示）",
          },
          task: {
            code: "S6T7O8P9 · AI_QUESTION",
            title: "任务已取消",
            state: "CANCELLED",
            steps: [
              { name: "ValidatePolicy 策略校验", mark: "done", label: "✓" },
              { name: "AskAi 模型询问", mark: "active", label: "■" },
              { name: "EmergencyStop 急停生效", mark: "skip", label: "⊘" },
            ],
            result: [["errorCode", "TASK_CANCELLED"]],
          },
        },
        {
          kicker: "SCENE 06 / 06",
          title: "实验统计（夹具样本）",
          narration: "成功率、耗时分布与错误分布统一在统计看板展示。",
          agentOnline: true,
          agentText: "Windows-Desk-01 · 在线 · v0.1.0（夹具节点）",
          chat: [{ type: "meta", text: "本页数据均来自测试夹具重复运行" }],
          metrics: [
            { value: "92.0%", label: "闭环成功率（夹具样本 25 次）" },
            { value: "13.20 s", label: "平均闭环耗时（夹具计时）" },
            { value: "2 次", label: "AI_PAGE_UNAVAILABLE（错误分布）" },
          ],
          fixtureAgain:
            "再次声明：以上为测试夹具产生的离线数据，不代表真实站点字段准确率或真实模型成功率。",
        },
      ];

      const refs = {
        agentDot: document.getElementById("agent-dot"),
        agentLine: document.getElementById("agent-line"),
        chat: document.querySelector('[data-testid="chat"]'),
        dots: document.getElementById("dots"),
        intercept: document.getElementById("intercept"),
        next: document.getElementById("next"),
        play: document.getElementById("play"),
        prev: document.getElementById("prev"),
        kicker: document.querySelector('[data-testid="scene-kicker"]'),
        narration: document.querySelector('[data-testid="scene-narration"]'),
        task: document.getElementById("task"),
        title: document.querySelector('[data-testid="scene-title"]'),
      };

      let current = 0;
      let playing = false;
      let playTimer;

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;");
      }

      function renderChat(messages) {
        refs.chat.innerHTML = messages
          .map((message) => `<div class="bubble ${message.type}">${escapeHtml(message.text)}</div>`)
          .join("");
      }

      function renderTask(scene) {
        if (scene.emptyTask !== undefined) {
          refs.task.innerHTML = `<div class="task-empty">${escapeHtml(scene.emptyTask)}</div>`;
          return;
        }
        if (scene.metrics !== undefined) {
          refs.task.innerHTML = `<div class="metrics-grid">${scene.metrics
            .map(
              (metric) =>
                `<div class="metric-tile"><strong>${escapeHtml(metric.value)}</strong><span>${escapeHtml(metric.label)}</span></div>`,
            )
            .join("")}</div>
            <div class="fixture-again">${escapeHtml(scene.fixtureAgain)}</div>`;
          return;
        }
        const task = scene.task;
        refs.task.innerHTML = `<div class="task-block">
          <div class="task-head">
            <div>
              <span class="task-code">${escapeHtml(task.code)}</span><br />
              <strong>${escapeHtml(task.title)}</strong>
            </div>
            <span class="state-pill ${task.state}">${task.state}</span>
          </div>
          <ul class="steps">
            ${task.steps
              .map(
                (step) =>
                  `<li><span class="step-mark ${step.mark}">${step.label}</span>${escapeHtml(step.name)}</li>`,
              )
              .join("")}
          </ul>
          <div class="result-box">
            ${task.result
              .map(
                ([left, right]) =>
                  `<div class="row"><span>${escapeHtml(left)}</span><code>${escapeHtml(right)}</code></div>`,
              )
              .join("")}
          </div>
        </div>`;
      }

      function render() {
        const scene = scenes[current];
        refs.kicker.textContent = scene.kicker;
        refs.title.textContent = scene.title;
        refs.narration.textContent = scene.narration;
        refs.agentLine.textContent = scene.agentText;
        refs.agentDot.classList.toggle("off", !scene.agentOnline);
        renderChat(scene.chat);
        refs.intercept.innerHTML =
          scene.intercept === undefined
            ? ""
            : `<div class="intercept-banner"><strong>${escapeHtml(scene.intercept.title)}</strong>${escapeHtml(scene.intercept.body)}</div>`;
        renderTask(scene);
        refs.prev.disabled = current === 0;
        refs.next.disabled = current === scenes.length - 1;
        for (const dot of refs.dots.children) {
          dot.classList.toggle("active", dot.dataset.index === String(current));
        }
      }

      refs.dots.innerHTML = scenes
        .map(
          (scene, index) =>
            `<button class="dot" data-index="${String(index)}">${String(index + 1)} · ${escapeHtml(scene.title)}</button>`,
        )
        .join("");

      refs.dots.addEventListener("click", (event) => {
        const button = event.target.closest(".dot");
        if (button === null) {
          return;
        }
        current = Number(button.dataset.index);
        render();
      });
      refs.prev.addEventListener("click", () => {
        current = Math.max(0, current - 1);
        render();
      });
      refs.next.addEventListener("click", () => {
        current = Math.min(scenes.length - 1, current + 1);
        render();
      });
      refs.play.addEventListener("click", () => {
        playing = !playing;
        refs.play.textContent = playing ? "暂停播放" : "自动播放";
        if (playing) {
          playTimer = setInterval(() => {
            if (current === scenes.length - 1) {
              playing = false;
              refs.play.textContent = "自动播放";
              clearInterval(playTimer);
              return;
            }
            current += 1;
            render();
          }, 2_800);
        } else {
          clearInterval(playTimer);
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "ArrowRight") {
          refs.next.click();
        }
        if (event.key === "ArrowLeft") {
          refs.prev.click();
        }
      });

      render();
    </script>
