[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "desktop-agent-python"
version = "0.1.0"
description = "Python Desktop Agent for the human operation simulator."
requires-python = ">=3.11,<3.13"
dependencies = [
  "pillow==11.3.0; sys_platform == 'win32'",
  "pydantic==2.13.5",
  "pywinauto==0.6.9; sys_platform == 'win32'",
  "websockets==17.1",
]

[project.scripts]
desktop-agent-python = "desktop_agent.main:main"
desktop-agent-windows-spike = "desktop_agent.notepad_spike:main"
desktop-agent-windows-mouse-spike = "desktop_agent.notepad_mouse_spike:main"
desktop-agent-wechat-inspect = "desktop_agent.uia_inspection:main"

[dependency-groups]
dev = [
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "ruff==0.16.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/desktop_agent"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

# `ctypes.windll` exists in the Windows typeshed only, so the ignores that keep macOS
# type checking clean are reported as unused on Windows. Disable that single check for
# the Windows-only module instead of removing the ignores (breaks macOS) or weakening
# strictness globally.
[[tool.mypy.overrides]]
module = "desktop_agent.windows_backend"
warn_unused_ignores = false

[tool.pytest.ini_options]
addopts = "--cov=desktop_agent --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.run]
omit = [
  "src/desktop_agent/__main__.py",
  "src/desktop_agent/main.py",
  "src/desktop_agent/windows_backend.py",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
