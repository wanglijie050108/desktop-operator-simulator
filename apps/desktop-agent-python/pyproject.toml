[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "desktop-agent-python"
version = "0.1.0"
description = "Python Desktop Agent for the human operation simulator."
requires-python = ">=3.11,<3.13"
dependencies = [
  "pydantic==2.13.5",
  "pywinauto==0.6.9; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/desktop_agent"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
addopts = "--cov=desktop_agent --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
