name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  node:
    name: Node quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks
        run: npm run check:node

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test Operator Web
        run: npm run test:ui:m2

  python:
    name: Python agent quality checks
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.18"
          python-version: "3.11"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --project apps/desktop-agent-python --locked

      - name: Run Python quality checks
        run: |
          uv run --directory apps/desktop-agent-python ruff format --check .
          uv run --directory apps/desktop-agent-python ruff check .
          uv run --directory apps/desktop-agent-python mypy src tests
          uv run --directory apps/desktop-agent-python pytest

  integration:
    name: Agent integration tests
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build Node services
        run: npm run build

      # The integration script starts the Python agent, so this job needs uv on PATH
      # too; uv is not preinstalled on the runner image.
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.18"
          python-version: "3.11"
          enable-cache: true

      - name: Install locked Python dependencies
        run: uv sync --project apps/desktop-agent-python --locked

      - name: Test Agent reconnection
        run: npm run test:integration:m1:python
